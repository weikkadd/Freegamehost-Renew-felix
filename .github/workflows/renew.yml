name: FGH-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */4 * * *'

permissions:
  actions: write
  contents: read

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb ffmpeg unzip curl wget fonts-noto-cjk
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 🐍 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper "requests[socks]" SpeechRecognition pydub

      - name: 📥 安装 sing-box（仅配置了 PROXY_URI 机场节点时）
        if: secrets.PROXY_URI != ''
        run: |
          SINGBOX_VERSION="1.12.0"
          SINGBOX_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          echo "Downloading sing-box v${SINGBOX_VERSION} from ${SINGBOX_URL}"
          wget --tries=3 --timeout=30 -O /tmp/singbox.tar.gz "${SINGBOX_URL}" || {
            echo "ERROR: Failed to download sing-box from ${SINGBOX_URL}"
            echo "Listing available releases at https://github.com/SagerNet/sing-box/releases"
            curl -s "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=3" | grep '"tag_name"'
            exit 1
          }
          # Verify file size (real sing-box is ~10MB+)
          FILE_SIZE=$(stat -c%s /tmp/singbox.tar.gz 2>/dev/null || stat -f%z /tmp/singbox.tar.gz)
          echo "Downloaded file size: ${FILE_SIZE} bytes"
          if [ "${FILE_SIZE}" -lt 1000000 ]; then
            echo "ERROR: Downloaded file too small (${FILE_SIZE} bytes), likely 404 error page"
            exit 1
          fi
          file /tmp/singbox.tar.gz
          # Extract — sing-box archives have a subdirectory like sing-box-1.12.0-linux-amd64/
          tar -xzf /tmp/singbox.tar.gz -C /tmp/
          sudo cp /tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          /usr/local/bin/sing-box version

      - name: 🌐 启用 WARP 网络（出口为 Cloudflare 消费者 IP，reCAPTCHA 信任，绕过数据中心 IP 软限制）
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 🔧 修复 DNS（WARP 接管后 systemd-resolved 会干扰解析）
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2
          curl -s --max-time 10 https://api.ipify.org && echo
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: 🔍 网络诊断
        run: |
          echo "=== 当前 IP ==="
          curl -s --max-time 10 https://api.ipify.org && echo
          echo ""
          echo "=== 测试访问 FreeGameHost ==="
          curl -s --max-time 15 -o /dev/null -w "HTTP %{http_code}, Time: %{time_total}s\n" https://panel.freegamehost.xyz/auth/login

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          PROXY_URI: ${{ secrets.PROXY_URI }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
