name: FGH-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */4 * * *'

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb ffmpeg unzip curl wget fonts-noto-cjk
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 🐍 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 📥 安装 xray-core
        run: |
          XRAY_VERSION="v26.7.28"
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          echo "Downloading xray-core ${XRAY_VERSION} from ${XRAY_URL}"
          # Use --content-disposition and verbose output for diagnostics
          wget --tries=3 --timeout=30 -O /tmp/xray.zip "${XRAY_URL}" || {
            echo "ERROR: Failed to download xray from ${XRAY_URL}"
            echo "Listing available releases at https://github.com/XTLS/Xray-core/releases"
            curl -s "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=3" | grep '"tag_name"'
            exit 1
          }
          # Verify file is a valid zip (not an HTML error page)
          FILE_SIZE=$(stat -c%s /tmp/xray.zip 2>/dev/null || stat -f%z /tmp/xray.zip)
          echo "Downloaded file size: ${FILE_SIZE} bytes"
          if [ "${FILE_SIZE}" -lt 1000000 ]; then
            echo "ERROR: Downloaded file too small (${FILE_SIZE} bytes), likely 404 error page"
            head -c 500 /tmp/xray.zip
            exit 1
          fi
          file /tmp/xray.zip
          sudo mkdir -p /usr/local/share/xray
          sudo unzip -q /tmp/xray.zip -d /usr/local/share/xray
          sudo cp /usr/local/share/xray/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          /usr/local/bin/xray version

      - name: 🔍 网络诊断
        run: |
          echo "=== 当前 IP ==="
          curl -s --max-time 10 https://api.ipify.org && echo
          echo ""
          echo "=== 测试访问 FreeGameHost ==="
          curl -s --max-time 15 -o /dev/null -w "HTTP %{http_code}, Time: %{time_total}s\n" https://panel.freegamehost.xyz/auth/login

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          PROXY_URI: ${{ secrets.PROXY_URI }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
