name: FGH-Renew

on:
  workflow_dispatch:
  schedule:
    # 每 4 小时运行一次（UTC 时间 0:00, 4:00, 8:00, 12:00, 16:00, 20:00）
    - cron: '0 */4 * * *'

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛡️ 启动 GOST 代理转发
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "$GOST_PROXY" ]; then
            echo "⏭️ 未配置代理，跳过 GOST"
            exit 0
          fi
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          ./gost -V
          # 启动 Gost 并立即查看错误
          ./gost -L http://:8080 -F "$GOST_PROXY" -D > gost.log 2>&1 &
          GOST_PID=$!
          echo "✅ GOST PID: $GOST_PID"
          sleep 3
          # 检查是否崩溃
          if ! kill -0 $GOST_PID 2>/dev/null; then
            echo "❌ GOST 立即退出！日志："
            cat gost.log
            exit 1
          fi
          # 测试通过 Gost 访问
          echo "🔍 测试 Gost 连通性..."
          curl -v -x http://127.0.0.1:8080 https://www.google.com --max-time 15 2>&1 | head -30
          echo ""
          echo "🌐 出口 IP: $(curl -s -x http://127.0.0.1:8080 https://api.ipify.org --max-time 15 || echo '获取失败')"
          echo ""
          echo "📋 Gost 日志："
          cat gost.log

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🔍 网络诊断
        run: |
          echo "=== 进程检查 ==="
          ps aux | grep -E "(gost|python)" | grep -v grep
          echo ""
          echo "=== 端口监听 ==="
          ss -tlnp | grep -E "(8080|chrome)" || netstat -tlnp 2>/dev/null | grep -E "(8080|chrome)"
          echo ""
          echo "=== 直接访问 FreeGameHost（无代理）==="
          curl -s --max-time 10 https://panel.freegamehost.xyz -o /dev/null -w "HTTP %{http_code}, Time: %{time_total}s\n" || echo "直接访问失败"
          echo ""
          echo "=== 通过 Gost 访问 FreeGameHost ==="
          curl -s --max-time 15 -x http://127.0.0.1:8080 https://panel.freegamehost.xyz -o /dev/null -w "HTTP %{http_code}, Time: %{time_total}s\n" || echo "代理访问失败"
          echo ""
          echo "=== Gost 完整日志 ==="
          cat gost.log

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          BROWSER_PROXY: http://127.0.0.1:8080
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          echo "=== 运行前状态 ==="
          ps aux | grep gost | grep -v grep || echo "⚠️ GOST 未运行！"
          echo ""
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py
          echo "脚本退出码: $?"

      - name: 📋 收集失败日志
        if: failure()
        run: |
          echo "=== Gost 日志（完整）==="
          cat gost.log 2>/dev/null || echo "无 gost.log"
          echo ""
          echo "=== 最后 50 行系统日志 ==="
          journalctl -n 50 --no-pager 2>/dev/null || dmesg | tail -50 || echo "无法获取系统日志"

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
