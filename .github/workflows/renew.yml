name: FGH-Renew

on:
  workflow_dispatch:
  schedule:
    # 每 4 小时运行一次（UTC 时间 0:00, 4:00, 8:00, 12:00, 16:00, 20:00）
    - cron: '0 */4 * * *'

jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛡️ 启动 GOST 代理转发
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "$GOST_PROXY" ]; then
            echo "⏭️ 未配置代理，跳过 GOST"
            exit 0
          fi
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          ./gost -V
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          GOST_PID=$!
          echo "✅ GOST PID: $GOST_PID"
          sleep 5
          # 检查 Gost 是否仍在运行
          if ! kill -0 $GOST_PID 2>/dev/null; then
            echo "❌ GOST 进程已退出，查看日志："
            cat gost.log
            exit 1
          fi
          echo "✅ GOST 正在运行，测试连通性..."
          curl -sv -x http://127.0.0.1:8080 https://api.ipify.org 2>&1 | tail -20
          echo "🌐 出口IP: $(curl -s -x http://127.0.0.1:8080 https://api.ipify.org 2>/dev/null || echo '无法获取')"

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🔍 调试网络信息
        run: |
          echo "=== GOST 进程 ==="
          ps aux | grep gost | grep -v grep || echo "GOST 未运行！"
          echo ""
          echo "=== 端口监听 ==="
          netstat -tlnp 2>/dev/null | grep 8080 || ss -tlnp | grep 8080 || echo "8080 端口未监听"
          echo ""
          echo "=== GOST 日志（最后20行）==="
          tail -20 gost.log 2>/dev/null || echo "无 gost.log"
          echo ""
          echo "=== 直接访问测试 ==="
          curl -s --max-time 10 https://panel.freegamehost.xyz -o /dev/null -w "HTTP %{http_code}\n" || echo "直接访问失败"

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          BROWSER_PROXY: http://127.0.0.1:8080
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          echo "=== 运行前检查 ==="
          ps aux | grep gost | grep -v grep || echo "⚠️ GOST 未在运行！"
          echo ""
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py
          echo "脚本退出码: $?"

      - name: 📋 收集 GOST 日志
        if: always()
        run: |
          echo "=== GOST 完整日志 ==="
          cat gost.log 2>/dev/null || echo "无 gost.log"
          echo ""
          echo "=== 网络状态 ==="
          netstat -tlnp 2>/dev/null | head -20 || ss -tlnp | head -20

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
